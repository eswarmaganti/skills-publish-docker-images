name: Docker Publish

on: 
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to docker registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Publish
        run: |
          docker build . -t ghcr.io/eswarmaganti/skills-publish-docker-images/stackoverflown:main
          docker push ghcr.io/eswarmaganti/skills-publish-docker-images/stackoverflown:main
