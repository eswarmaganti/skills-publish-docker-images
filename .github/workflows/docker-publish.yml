name: Docker Publish

on: 
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3
      - name: Login to docker registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: |
            ghcr.io/eswarmaganti/skills-publish-docker-images/stackoverflown:main
            ghcr.io/eswarmaganti/skills-publish-docker-images/stackoverflown:${{ github.sha }}
